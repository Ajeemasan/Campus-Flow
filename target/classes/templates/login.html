
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusFlow</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f3ff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(70, 50, 120, 0.12);
        }

        h1 {
            text-align: center;
            color: #6d28d9;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .message {
            text-align: center;
            margin-top: 16px;
            color: #dc2626;
        }

        .success {
            text-align: center;
            margin-top: 16px;
            color: #15803d;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #555;
        }

        a {
            color: #6d28d9;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CampusFlow</h1>
        <p class="subtitle">Welcome back! Log in to continue.</p>

        <form th:action="@{/login}" method="post">
            <label for="username">Email</label>
            <input type="email" id="username" name="username"
                   placeholder="Enter your registered email"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password" required>

            <button type="submit">Log In</button>
        </form>

        <p class="message" th:if="${param.error}">
            Invalid email or password. Please try again.
        </p>

        <p class="success" th:if="${param.logout}">
            You have logged out successfully.
        </p>

        <p class="success" th:if="${success}" th:text="${success}"></p>

        <p class="footer">
            Don't have an account?
            <a th:href="@{/register}">Register here</a>
        </p>
    </div>
</body>
</html>

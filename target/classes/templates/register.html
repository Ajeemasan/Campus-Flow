
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusFlow</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f3ff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(70, 50, 120, 0.12);
        }

        h1 {
            text-align: center;
            color: #6d28d9;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #c4b5fd;
            border-color: #7c3aed;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .message {
            margin-top: 12px;
            text-align: center;
            color: #dc2626;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #555;
        }

        a {
            color: #6d28d9;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CampusFlow</h1>
        <p class="subtitle">Create your student account</p>

        <form th:action="@{/register}" method="post">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName"
                   placeholder="Enter your full name"
                   th:value="${fullName}" required>

            <label for="email">College Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email"
                   th:value="${email}" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Minimum 8 characters"
                   minlength="8" required>

            <button type="submit">Create Account</button>
        </form>

        <p class="message" th:if="${error}" th:text="${error}"></p>

        <p class="footer">
            Already have an account?
            <a th:href="@{/login}">Log in</a>
        </p>
    </div>
</body>
</html>
